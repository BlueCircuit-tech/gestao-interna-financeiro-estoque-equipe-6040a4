<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ControlaPro — Gestão Inteligente</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: {
              50:  '#F0FDF4',
              100: '#DCFCE7',
              200: '#BBF7D0',
              300: '#86EFAC',
              400: '#4ADE80',
              500: '#22C55E',
              600: '#16A34A',
              700: '#15803D',
              800: '#166534',
              900: '#14532D',
              950: '#052E16',
            },
            destaque: {
              50:  '#FFF7ED',
              100: '#FFEDD5',
              200: '#FED7AA',
              300: '#FDBA74',
              400: '#FB923C',
              500: '#F97316',
              600: '#EA580C',
              700: '#C2410C',
            },
          },
          fontFamily: {
            display: ['Outfit', 'sans-serif'],
            body:    ['Plus Jakarta Sans', 'sans-serif'],
          },
          boxShadow: {
            'app':     '0 25px 50px -12px rgba(20, 83, 45, 0.25)',
            'card':    '0 1px 3px rgba(20, 83, 45, 0.08), 0 1px 2px rgba(20, 83, 45, 0.12)',
            'card-hover': '0 8px 24px rgba(20, 83, 45, 0.12), 0 2px 6px rgba(20, 83, 45, 0.08)',
            'nav':     '0 -4px 20px rgba(20, 83, 45, 0.1)',
            'float':   '0 12px 40px rgba(34, 197, 94, 0.3)',
            'modal':   '0 25px 60px rgba(5, 46, 22, 0.35)',
          },
          borderRadius: {
            'app':  '32px',
            'card': '16px',
            'btn':  '12px',
            'input':'10px',
            'chip': '20px',
          },
        },
      },
    };
  </script>
  <style>
    *, *::before, *::after { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #052E16 0%, #14532D 40%, #166534 100%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #BBF7D0; border-radius: 8px; }

    :focus-visible {
      outline: 2px solid #22C55E;
      outline-offset: 2px;
      border-radius: 4px;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeSlideOut {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(-8px); }
    }
    [data-tela]:not(.hidden) {
      animation: fadeSlideIn 0.32s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    [data-tela].hidden {
      display: none;
    }

    .phone-frame {
      width: 100%;
      max-width: 390px;
      height: 844px;
      max-height: 94vh;
      background: #F0FDF4;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(5, 46, 22, 0.45), 0 0 0 2px #1a1a1a, 0 0 0 6px #0a0a0a;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    @media (max-width: 430px) {
      body { padding: 0; align-items: stretch; }
      .phone-frame {
        max-width: 100%;
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
        box-shadow: none;
      }
    }

    .status-bar {
      height: 44px;
      min-height: 44px;
      background: #14532D;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .status-bar time {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 13px;
      color: #F0FDF4;
    }
    .status-icons { display: flex; align-items: center; gap: 6px; }

    .app-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      scroll-behavior: smooth;
    }
    .app-container::-webkit-scrollbar { width: 3px; }
    .app-container::-webkit-scrollbar-thumb { background: #BBF7D0; border-radius: 8px; }

    .nav-bottom {
      height: 68px;
      min-height: 68px;
      background: #ffffff;
      border-top: 1px solid #DCFCE7;
      box-shadow: 0 -4px 20px rgba(20, 83, 45, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding-bottom: env(safe-area-inset-bottom, 0);
      z-index: 50;
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 4px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: #94A3B8;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 9px;
      font-weight: 600;
      transition: color 0.2s ease, transform 0.15s ease;
      position: relative;
      min-width: 48px;
      -webkit-user-select: none;
      user-select: none;
    }
    .nav-btn:active { transform: scale(0.88); }
    .nav-btn svg { width: 22px; height: 22px; transition: stroke 0.2s ease, fill 0.2s ease; }
    .nav-btn.ativo { color: #14532D; }
    .nav-btn.ativo::before {
      content: '';
      position: absolute;
      top: -2px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 3px;
      background: #22C55E;
      border-radius: 0 0 4px 4px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 1px 3px rgba(20, 83, 45, 0.06), 0 1px 2px rgba(20, 83, 45, 0.04);
      transition: box-shadow 0.25s ease, transform 0.2s ease;
    }
    .card:active {
      transform: scale(0.985);
      box-shadow: 0 2px 6px rgba(20, 83, 45, 0.1);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      font-family: 'Plus Jakarta Sans', sans-serif;
      letter-spacing: 0.01em;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      -webkit-user-select: none;
      user-select: none;
    }
    .btn:active { transform: scale(0.95); }
    .btn-primary {
      background: linear-gradient(135deg, #14532D, #166534);
      color: #F0FDF4;
      box-shadow: 0 4px 14px rgba(20, 83, 45, 0.3);
    }
    .btn-primary:hover { box-shadow: 0 6px 20px rgba(20, 83, 45, 0.4); }
    .btn-success {
      background: linear-gradient(135deg, #22C55E, #16A34A);
      color: #052E16;
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.3);
    }
    .btn-success:hover { box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4); }
    .btn-outline {
      background: #fff;
      color: #14532D;
      border: 2px solid #DCFCE7;
    }
    .btn-danger {
      background: linear-gradient(135deg, #EF4444, #DC2626);
      color: #fff;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3);
    }

    .input-field {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #DCFCE7;
      border-radius: 10px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      color: #14532D;
      background: #fff;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      outline: none;
    }
    .input-field:focus {
      border-color: #22C55E;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
    }
    .input-field::placeholder { color: #94A3B8; }

    .avatar {
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    #toast-container {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      width: 360px;
      max-width: calc(100% - 32px);
    }
    .toast {
      pointer-events: auto;
      padding: 14px 18px;
      border-radius: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: toastIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }
    .toast.sair { animation: toastOut 0.3s ease forwards; }
    .toast-ok    { background: #14532D; color: #F0FDF4; }
    .toast-erro  { background: #EF4444; color: #fff; }
    .toast-info  { background: #fff; color: #14532D; border: 2px solid #DCFCE7; }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-20px) scale(0.9); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to   { opacity: 0; transform: translateY(-20px) scale(0.85); }
    }

    #modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 46, 22, 0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 8000;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #modal-overlay.aberto {
      opacity: 1;
      pointer-events: auto;
    }
    #modal-card {
      background: #fff;
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 390px;
      max-height: 70vh;
      overflow-y: auto;
      padding: 24px 20px 32px;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #modal-overlay.aberto #modal-card {
      transform: translateY(0);
    }
    @media (min-width: 431px) {
      #modal-overlay { align-items: center; }
      #modal-card {
        border-radius: 24px;
        max-height: 60vh;
        transform: translateY(30px) scale(0.95);
      }
      #modal-overlay.aberto #modal-card {
        transform: translateY(0) scale(1);
      }
    }

    .stat-number {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      line-height: 1;
    }
    .section-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      color: #14532D;
    }
    .menu-icon-btn {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      border: none;
      background: transparent;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .menu-icon-btn:active { background: #DCFCE7; }
  </style>
</head>

  <!-- Modal genérico -->
  <div id="modal-overlay" onclick="if(event.target===this)fecharModal()">

      <div class="flex items-center justify-between mb-4">

        </button>

      <div id="modal-conteudo"></div>

  <script>
    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function (s) {
        s.classList.toggle('hidden', s.dataset.tela !== id);
      });
      document.querySelectorAll('[data-nav]').forEach(function (b) {
        b.classList.toggle('ativo', b.dataset.nav === id);
      });
      var container = document.getElementById('app-container');
      if (container) container.scrollTop = 0;
    }

    function toast(mensagem, tipo) {
      var container = document.getElementById('toast-container');
      var el = document.createElement('div');
      var icone = '';
      if (tipo === 'ok') icone = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
      else if (tipo === 'erro') icone = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
      else icone = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';
      el.className = 'toast toast-' + tipo;
      el.innerHTML = icone + '<span>' + mensagem + '</span>';
      container.appendChild(el);
      setTimeout(function () {
        el.classList.add('sair');
        setTimeout(function () { el.remove(); }, 300);
      }, 3000);
    }

    function abrirModal(html, titulo) {
      document.getElementById('modal-titulo').textContent = titulo || '';
      document.getElementById('modal-conteudo').innerHTML = html;
      document.getElementById('modal-overlay').classList.add('aberto');
      document.body.style.overflow = 'hidden';
    }
    function fecharModal() {
      document.getElementById('modal-overlay').classList.remove('aberto');
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') fecharModal();
    });

    function brl(valor) {
      return 'R$ ' + Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function dataBR(iso) {
      if (!iso) return '—';
      var d = new Date(iso + 'T12:00:00');
      var dd = String(d.getDate()).padStart(2, '0');
      var mm = String(d.getMonth() + 1).padStart(2, '0');
      var aaaa = d.getFullYear();
      return dd + '/' + mm + '/' + aaaa;
    }

    function atualizarRelogio() {
      var now = new Date();
      var h = String(now.getHours()).padStart(2, '0');
      var m = String(now.getMinutes()).padStart(2, '0');
      var el = document.getElementById('status-time');
      if (el) el.textContent = h + ':' + m;
    }
    atualizarRelogio();
    setInterval(atualizarRelogio, 30000);

    document.addEventListener('DOMContentLoaded', function () {
      mostrarTela('painel-principal');
    });
  </script>
</body>
</html>
